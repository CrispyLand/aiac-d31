spring:
  application:
    name: agent-chat
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        enabled: false        # we use Cerebras for chat, not OpenAI
      embedding:
        enabled: true
        options:
          model: ${rag.embedding.model:text-embedding-3-small}

    mcp:
      client:
        enabled: true
        name: agent-chat
        version: 0.0.1
        request-timeout: 10s
        type: SYNC

        # The one setting that keeps this app independent of the other one. Left at its default
        # of `true`, the autoconfiguration calls initialize() while BUILDING the bean, so a
        # stopped MCP server would stop THIS app from booting — the agent unreachable because a
        # side panel's dependency was down. False means the transport is built but nobody has
        # dialled it yet, which is also what gives the indicator something true to report: red
        # is then a real un-dialled state rather than a guess.
        initialized: false

        # Still false, and this is not the same thing as the tools being unused. That flag wires
        # MCP into Spring AI's own ChatClient, which this application does not use — it posts to
        # Cerebras itself. The discovered tools reach the model through McpToolBox instead, so turning
        # this on would only register callbacks nothing reads.
        toolcallback:
          enabled: false

        # Two connections over two different transports, and the page merges what they report.
        # That is the point of having a second one at all: MCP is worth little if a client can
        # only talk to the server it was written against, so one of these is a process on this
        # laptop and the other is a stranger's server on the public internet, discovered the
        # same way and rendered by the same loop.
        sse:
          connections:
            # The key is the connection's local name, and it is what the page shows before the
            # handshake, while the server has not yet said what it calls itself.
            calendar:
              url: http://localhost:8081
              sse-endpoint: /sse
            weather:
              url: http://localhost:8082
              sse-endpoint: /sse

        # A separate block, not another entry above, because the transport is genuinely different:
        # SSE opens a long-lived stream and gets a session back, streamable HTTP posts JSON-RPC to
        # one endpoint. Spring autoconfigures each independently and both arrive as McpSyncClient
        # beans in the same list, which is why McpCatalogue needs no branch for this.
        streamable-http:
          connections:
            frankfurter:
              # Frankfurter serves MCP at the root, so the endpoint has to be given explicitly —
              # the default here is /mcp, and leaving it would 404 against this host.
              url: https://mcp.frankfurter.dev
              endpoint: /

server:
  port: 8080

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  chat-id: ${TELEGRAM_CHAT_ID}

  # Day 30 — Telegram bot as a private AI service.
  # Uses Ollama directly (not the web UI's provider switch).
  bot:
    enabled: false                                  # enable on VPS only
    token: ${TELEGRAM_BOT_TOKEN:}
    model: qwen2.5:0.5b                             # small model for VPS (4GB RAM)
    admin-user-ids:                                  # admin = the owner's chat ID
      - "${TELEGRAM_CHAT_ID:0}"
    allow-all: false                                # beta mode: only admin-user-ids
    max-queue-size: 5
    rate-limit-per-minute: 3
    rate-limit-per-day: 30
    max-input-length: 500
    max-output-tokens: 400
    timeout-seconds: 120
    blocked-user-ids: []
    system-prompt: >
      You are a concise, helpful AI assistant running on a private server.
      Answer directly and keep responses short. If you don't know, say so.

# ---------------------------------------------------------------------------
# Everything the agent does is tunable from here. The page may override any of
# the `defaults` per request; whatever it leaves empty falls back to these.
# ---------------------------------------------------------------------------
agent:
  # Whether the agent talks to MCP servers at all, as the page's switch finds it on a cold
  # start. The switch moves this at runtime; this is only the position it starts in.
  mcp:
    enabled: false

    # How many times one turn may stop, run what the model asked for, and ask again. Eight covers
    # the Day-20 pipeline: getSchedule → getTasks → getWeather → [frankfurter rate] → summarize
    # → saveToFile, plus any retry the model makes, and is still low enough that a runaway model
    # costs nine requests rather than a bill. Hitting the ceiling is logged as a WARN.
    max-tool-rounds: 8

  api-key: ${CEREBRAS_API_KEY:}                                # never hardcode the key
  endpoint: https://api.cerebras.ai/v1/chat/completions
  connect-timeout: 10s
  read-timeout: 120s

  # Offered in the model dropdown on the page (must match what your key can access).
  available-models:
    - gpt-oss-120b

  # Cerebras does not support reasoning_effort — always omit.
  reasoning-efforts:
    - ""

  defaults:
    model: gpt-oss-120b
    system-prompt: "You are a concise, helpful assistant. Answer directly and avoid filler. Don't lie and don't create facts. Be honest and tell me you don't know if you have no answer."
    temperature: 0.0
    max-completion-tokens: 1024
    reasoning-effort: ""            # Cerebras does not support this — always omit
    stop-sequences: []              # e.g. ["\n\n", "END"]
    response-schema: ""             # optional JSON schema -> forces structured output

  input-policy:
    max-length: 8000                # 0 = unlimited

  output-policy:
    max-length: 0                   # 0 = unlimited

  memory:
    # Backstop, counted in messages (1 turn = 2 messages). With compression on, the stack never
    # gets this far: it is folded at keep-recent + compress-every and then shrinks back, so this
    # only bites if compression is switched off. Keep it above that sum or turns will be
    # destroyed before the summarizer ever reads them. 0 = keep everything.
    # The system prompt is not stored — it is re-applied fresh on every turn.
    max-messages: 20

    # json = the dialogue is written to disk and reloaded on startup, so a restart is
    # invisible to the user. memory = kept in RAM only, forgotten on shutdown.
    store: json
    file: ./data/conversations.json

    # Which lines the conversation has been split into, and which one is open. Refs only —
    # a branch's messages live in the file above, under `<conversation-id>/<branch-id>`.
    branch-file: ./data/branches.json

  # LONG-TERM MEMORY — what is kept about the visitor once every conversation above is gone.
  #
  # Keyed by visitor, not by conversation, which is what lets it survive a reset and what makes
  # it the one layer that needs a delete button. Its own file for the same reason: `ls ./data`
  # should show three lifetimes as three files, and clearing a conversation should not be one
  # `clear()` bug away from clearing this.
  long-term:
    file: ./data/memory.json

    # Ceiling per visitor. The other layers end on their own — a reset empties short-term, a
    # closed task empties working — but nothing ever ends this one, so without a cap a regular
    # visitor's prompt starts a little larger every week and nobody notices until it overflows.
    max-entries: 24

  # INVARIANTS — the standing rules the assistant may not break.
  #
  # Not a memory layer and not a profile: memory is what the agent inferred, a profile is how the
  # user wants to be spoken to, and an invariant is what may not be proposed at all. Only a person
  # can declare or retire one — nothing in the extraction path can write here, because a model that
  # can mint its own constraints can mint the one that permits what it wanted to do.
  #
  # Its own file so that `cat ./data/invariants.json` answers "what is this assistant not allowed
  # to do?" without reading a transcript. No cap: a ceiling here would silently drop a rule the
  # user still believes is in force, and they would find out when the agent proposed it.
  invariants:
    file: ./data/invariants.json

    # The guard is tiered, and this only pays for the top tier. A rule with watched terms that
    # `forbid` outright is settled in Java for nothing; only a `watch` term that actually hit, or
    # a `model` rule that has no terms to hit, is worth a call. Most turns make none.
    model: gpt-oss-120b
    max-tokens: 400
    reasoning-effort: ""

  # PERSONALIZATION — and note that this is not a fourth memory layer.
  #
  # Everything above is something the agent worked out from what was said, and each layer ends at
  # some boundary. A profile ends at none of them: it is what a person declared about how they
  # want to be answered, in a file they edit, and it applies identically whatever the conversation
  # has been about. That difference is why it is priced on its own line in the budget and why it
  # is rendered above every memory block — see ContextPlanner. Where a profile and a remembered
  # preference disagree, the profile wins, because one was asked for and the other was inferred.
  profiles:
    # A directory, not classpath resources: packaged into the jar these would be read-only at
    # exactly the moment somebody wants to change how the agent talks to them. Read fresh every
    # turn, so an edit takes effect on the next message rather than the next restart.
    directory: ./profiles

  # The briefing card: the MCP server's scheduled job, shown and controlled from this page.
  #
  # Its own URL rather than reusing the MCP connection below, even though they are the same host on
  # both the laptop and the VPS. That one is the model's route to a tool protocol; this is a page's
  # route to a management endpoint — and switching the calendar server off in the MCP panel, which is
  # a decision about tokens, should not also blank the card.
  briefing:
    url: http://localhost:8081

    # Short, because this is read before EVERY rendered view, including the POST that answers a chat
    # turn. A slow answer here is a slow chat reply. The client cannot throw, so the cost of the
    # timeout expiring is a card that says "unreachable" next to a reply that arrived normally.
    timeout: 2s

    # The "collect now" button, which is a different kind of request: the server does two Google reads
    # and a model call on its own request thread. Giving up early would report a failure that did not
    # happen, and leave the page disagreeing with the file.
    collect-timeout: 45s

  # The second window. max-messages above bounds the dialogue in messages; the model bills
  # and rejects in tokens, so the prompt is priced locally before every call.
  context:
    # Each call must fit prompt + max-completion-tokens into this. These are the models'
    # real limits, so overflow is unreachable by hand — see application-demo.yml for a
    # pretend window small enough to hit on camera.
    windows:
      "[gpt-oss-120b]": 50000
    default-window: 50000

    # off  = send anyway and let Cerebras reject it (shows the raw context_length_exceeded)
    # fail = refuse locally, before the call is paid for, and explain the arithmetic
    # trim = drop the oldest turns until it fits, the way production assistants do
    overflow-policy: fail

    # Fraction of the window at which the page starts warning.
    warn-at: 0.80

  # WORKING MEMORY — the key/value block for the task in hand. Always maintained.
  #
  # Note the cost shape, because it is the real difference between this and compression:
  # summarization pays ~500 tokens once every fifth turn, this pays ~150-300 tokens on EVERY
  # turn. Over a short conversation that makes facts the more expensive of the two; over a long
  # one the summary's fold cost keeps recurring while the fact block stops growing at max-facts.
  facts:
    # Blank = agent.defaults.model. Extraction is a mechanical rewrite, not a reasoning task,
    # so the small model is the right default here for the same reason it is for summaries.
    model: gpt-oss-120b

    # Ceiling on the block, and therefore on this segment of every future prompt. Bounding it by
    # count rather than tokens is deliberate: it is a list, and a list that silently loses its
    # tail is worse than one that refuses to grow.
    max-facts: 12

    # Ceiling on the extraction reply. Without gpt-oss hidden reasoning tokens consuming the
    # budget first, the full 600 tokens go to the fact block itself.
    max-tokens: 600

    # Cerebras does not support reasoning_effort — always omit.
    reasoning-effort: ""

  # SHORT-TERM MEMORY — how the dialogue stays bounded. max-messages and overflow-policy both
  # shrink the context by forgetting; this rewrites the old turns into notes and sends those
  # instead, so the cost stops growing without the dialogue losing what happened. Always on.
  #
  # keep-recent-messages is now the ONLY tail setting. There used to be a second one
  # (strategy.window-messages) that cut the transcript at read time while this one folded it at
  # write time. Two boundaries meant a message could fall outside the window without ever having
  # been folded — covered by neither, and nothing said so. One number, one boundary:
  # what falls out of the tail is exactly what gets summarized.
  compression:
    # The tail that is always sent verbatim. Recency is where pronouns, corrections and
    # "no, the other one" live, and a summary is a poor substitute for the last few turns.
    keep-recent-messages: 6

    # Minimum backlog beyond that tail before summarizing is worth the request it costs.
    # 10 messages = 5 turns, so compression fires roughly every fifth turn.
    #
    # This number is an economic choice, not a cosmetic one. A fold costs a whole extra call —
    # measured at ~500 tokens, most of it the fixed instruction prompt — and buys back ~125
    # tokens on every turn that follows. Folding 10 messages at a time, that paid for itself
    # five turns later; folding 4 at a time it did not pay for itself at all within a short
    # conversation, because the same fixed cost was amortized over a quarter as much transcript.
    # Lower it to see compression sooner on camera, not to save more.
    compress-every: 10

    # Who writes the notes. Blank = whatever agent.defaults.model is. A small model is usually
    # the right call: summarizing is much easier than answering, and this runs on every 5th turn.
    model: gpt-oss-120b

    # Ceiling on the notes, and therefore on this segment of every future prompt. This is the
    # number that makes the cost curve flat instead of quadratic. Without gpt-oss's hidden
    # reasoning tokens competing for this budget, the full 800 tokens go to the notes.
    max-summary-tokens: 800

    # Cerebras does not support reasoning_effort — always omit.
    reasoning-effort: ""

  # LOCAL LLM — Ollama's OpenAI-compatible endpoint at /v1/chat/completions.
  #
  # When enabled the page shows a provider toggle: Cerebras (cloud) vs Ollama (local).
  # Both speak the same protocol, so the switch is just two CerebrasLlmClient instances
  # behind a delegate. The model is overridden on every request — whatever the dropdown
  # says is ignored while Ollama is active.
  ollama:
    enabled: true
    endpoint: http://localhost:11434/v1/chat/completions
    model: llama3.2:3b
    optimized-model: llama3.2:3b-rag
    read-timeout: 300s

rag:
  chunk-size: 800
  overlap: 100
  index-dir: ./data/index
  search:
    candidate-k: 10             # first-pass cosine retrieval
    final-k: 3                  # chunks injected into the prompt (after reranking)
    similarity-threshold: 0.30  # cosine cutoff for first pass
  embedding:
    enabled: true
    model: text-embedding-3-small
    dimension: 1536
  rerank:
    enabled: true
    model: gpt-oss-120b         # same Cerebras model by default
    score-threshold: 5          # 0-10; candidates below are dropped after LLM scoring
    max-chunk-chars: 1000       # truncate candidate text in the reranker prompt
    max-tokens: 2000            # must cover gpt-oss hidden reasoning + the JSON array
  query-rewrite:
    enabled: true               # rewrite vague questions for better RAG recall
    model: gpt-oss-120b
  evaluation:
    enabled: false              # GET /rag/evaluate is disabled unless true

logging:
  level:
    com.crispyland: INFO
